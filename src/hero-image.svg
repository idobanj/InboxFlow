<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient definitions using various color formats -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:rgb(255, 107, 53);stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:hsl(15, 100%, 60%);stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="blackGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:rgba(0, 0, 0, 0.9);stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:0.3" />
    </radialGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:hsla(15, 100%, 60%, 0.8);stop-opacity:1" />
      <stop offset="100%" style="stop-color:rgba(255, 107, 53, 0.2);stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background using named color -->
  <rect width="800" height="400" fill="black"/>
  
  <!-- Abstract flowing shapes - demonstrating different color formats -->
  <!-- Orange wave 1 - using hex -->
  <path d="M0,200 Q200,100 400,150 T800,180 L800,400 L0,400 Z" fill="url(#orangeGradient)" opacity="0.9"/>
  
  <!-- Orange wave 2 - using rgb -->
  <path d="M0,250 Q250,150 500,200 T800,230 L800,400 L0,400 Z" fill="rgb(255, 107, 53)" opacity="0.7"/>
  
  <!-- Glowing orb 1 - using rgba -->
  <circle cx="200" cy="150" r="80" fill="rgba(255, 107, 53, 0.6)" filter="url(#glow)"/>
  
  <!-- Glowing orb 2 - using hsl -->
  <circle cx="600" cy="250" r="100" fill="hsl(15, 100%, 60%)" opacity="0.5"/>
  
  <!-- Abstract energy lines - using hsla -->
  <path d="M100,100 Q300,200 500,100" stroke="hsla(15, 100%, 60%, 0.8)" stroke-width="4" fill="none"/>
  <path d="M200,300 Q400,200 600,300" stroke="rgba(255, 107, 53, 0.6)" stroke-width="3" fill="none"/>
  
  <!-- Radial glow effect - using named color with opacity -->
  <ellipse cx="400" cy="200" rx="200" ry="150" fill="url(#blackGradient)"/>
  
  <!-- Bright accent points -->
  <circle cx="300" cy="180" r="15" fill="#FF6B35"/>
  <circle cx="500" cy="220" r="12" fill="rgb(255, 107, 53)"/>
  <circle cx="450" cy="250" r="10" fill="hsl(15, 100%, 60%)"/>
  
  <!-- Filter for glow effect -->
  <filter id="glow">
    <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
    <feMerge>
      <feMergeNode in="coloredBlur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
</svg>
